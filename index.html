<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none';">
    <title>svg-flow - SVG Flow Animator</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Drop zone */
        #dropzone {
            border: 3px dashed #4a4a6a;
            border-radius: 12px;
            padding: 60px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
            cursor: pointer;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #dropzone:hover, #dropzone.dragover {
            border-color: #6c63ff;
            background: rgba(108, 99, 255, 0.1);
        }
        #dropzone p { color: #888; font-size: 24px; }

        /* Main layout */
        .workspace { display: none; gap: 20px; }
        .workspace.active { display: grid; grid-template-columns: 1fr 280px; }

        /* SVG panel */
        #svg-panel {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            min-height: 500px;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        #svg-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        #svg-toolbar button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 12px;
        }
        #svg-toolbar button:hover { background: #e5e5e5; }
        #svg-toolbar button.active { background: #6c63ff; color: #fff; border-color: #6c63ff; }
        #svg-container {
            flex: 1;
            overflow: auto;
            cursor: grab;
        }
        #svg-container.panning { cursor: grabbing; }
        #svg-container svg { display: block; }
        #svg-container.fit-view svg { max-width: 100%; height: auto; }
        #svg-container.actual-size svg { max-width: none; }
        #svg-container [id] { cursor: pointer; transition: all 0.2s; }
        #svg-container [id]:hover { filter: brightness(0.95); }
        #svg-container .selected {
            /* Color applied via inline style */
        }
        #svg-container .animated-highlight {
            /* Outline applied via inline style for color blending */
            transition: outline 0.15s ease-out;
        }

        /* Preview overlay */
        #preview-overlay {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
        }
        #preview-overlay.active { display: block; }

        /* Sidebar */
        .sidebar {
            background: #252540;
            border-radius: 12px;
            padding: 20px;
        }
        .sidebar h3 { margin-bottom: 15px; font-size: 14px; text-transform: uppercase; color: #888; }

        /* Path list */
        #path-list {
            list-style: none;
            margin-bottom: 20px;
            min-height: 80px;
            max-height: 300px;
            overflow-y: auto;
            background: #1a1a2e;
            border-radius: 8px;
            padding: 10px;
        }
        #path-list li {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #4a4a6a;
            border-radius: 6px;
            margin-bottom: 6px;
            font-family: monospace;
            font-size: 13px;
        }
        #path-list li .num {
            background: #6c63ff;
            color: #fff;
            min-width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            margin-right: 10px;
        }
        #path-list li .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #path-list li .remove {
            margin-left: 8px;
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }
        #path-list:empty::after {
            content: 'Click SVG elements to build animation path';
            color: #666;
            font-size: 13px;
            display: block;
            text-align: center;
            padding: 20px;
        }

        /* Path tabs */
        #path-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .path-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            background: #4a4a6a;
            cursor: pointer;
            font-size: 13px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .path-tab:hover { background: #5a5a7a; }
        .path-tab.active { border-color: #fff; }
        .path-tab .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .path-tab .delete-path {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 0 2px;
        }
        .path-tab .delete-path:hover { color: #ff6b6b; }
        #add-path-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #4a4a6a;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #add-path-btn:hover { background: #5a5a7a; }

        /* Fork button in path list */
        #path-list li .fork {
            margin-left: 4px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
        }
        #path-list li .fork:hover { color: #4ecdc4; }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .btn-primary { background: #6c63ff; color: #fff; }
        .btn-primary:hover { background: #5a52e0; }
        .btn-primary:disabled { background: #4a4a6a; cursor: not-allowed; }
        .btn-secondary { background: #4a4a6a; color: #fff; }
        .btn-secondary:hover { background: #5a5a7a; }
        .btn-danger { background: #ff6b6b; color: #fff; }
        .btn-danger:hover { background: #e55a5a; }
        .btn-stop { background: #ff6b6b; color: #fff; }

        /* Settings */
        .setting { margin-bottom: 15px; }
        .setting label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        .setting input, .setting select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #4a4a6a;
            border-radius: 6px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
        }

        /* Info */
        #element-info {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 6px;
        }

        /* Animation state */
        .previewing #svg-container [id] { cursor: default; }
        .previewing #svg-container [id]:hover { filter: none; }
        #svg-panel.previewing + .sidebar { pointer-events: none; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>svg-flow</h1>

        <div id="dropzone">
            <p>Drop SVG file here or click to browse</p>
            <input type="file" id="file-input" accept=".svg" hidden>
        </div>

        <div class="workspace" id="workspace">
            <div id="svg-panel">
                <div id="svg-toolbar">
                    <button id="fit-btn" class="active">Fit to View</button>
                    <button id="actual-btn">Actual Size</button>
                    <span style="color: #888; font-size: 12px; margin-left: 8px; align-self: center;">Drag to pan when zoomed</span>
                </div>
                <div id="svg-container" class="fit-view"></div>
                <div id="preview-overlay">
                    <button class="btn btn-stop" id="stop-btn">Stop Preview</button>
                </div>
            </div>

            <div class="sidebar">
                <h3>Animation Paths</h3>
                <div id="path-tabs"></div>
                <ul id="path-list"></ul>

                <button class="btn btn-secondary" id="clear-path">Clear Path</button>


                <div class="setting">
                    <label>Time per element (ms)</label>
                    <input type="number" id="step-duration" value="500" min="100" max="3000" step="100">
                </div>

                <button class="btn btn-primary" id="preview-btn" disabled>Preview Animation</button>
                <button class="btn btn-primary" id="download-btn" disabled>Download Lottie</button>

                <div id="element-info"></div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
